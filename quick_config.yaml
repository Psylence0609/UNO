# Configuration for quick UNO RL training

# Training Configuration
training:
  episodes: 1000  # Reduced for quick test
  batch_size: 32
  learning_rate: 0.001
  gamma: 0.99  # Discount factor
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.995
  memory_size: 5000  # Reduced memory
  target_update_freq: 500  # More frequent updates
  
# DQN Configuration
dqn:
  hidden_layers: [256, 128]  # Smaller network
  activation: "relu"
  dropout: 0.1
  dueling: true
  double_dqn: true
  
# DMC Configuration  
dmc:
  simulations: 1000
  exploration_weight: 1.4
  hidden_layers: [512, 256]
  
# MCTS Configuration
mcts:
  num_simulations: 100
  exploration_constant: 1.414
  max_depth: 50
  
# Environment Configuration
environment:
  game: "uno"
  num_players: 2
  seed: 42
  
# Evaluation Configuration
evaluation:
  eval_episodes: 200  # Fewer evaluation episodes
  eval_freq: 200  # Evaluate every N training episodes
  opponents: ["random", "rule_based"]
  
# Logging Configuration
logging:
  log_level: "INFO"
  log_dir: "./logs"
  tensorboard: true
  wandb: false  # Set to true if using Weights & Biases
  save_freq: 500  # Save model every N episodes
  
# Paths
paths:
  models: "./models"
  logs: "./logs"
  experiments: "./experiments"